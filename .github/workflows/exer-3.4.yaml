name: The ordered pipeline

on: 
    push:
    workflow_dispatch:

jobs:
    setup:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7
            - name: Setup Python version
              uses: actions/setup-python@v7
              with:
                  python-version: "3.11"
            - name: Completed
              run: |
                echo "Setup done"
                exit 1 # Deliberately fail the setup job to test the pipeline behavior

    verify:
        runs-on: ubuntu-latest
        needs: setup
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7
            - name: Prints the runtime version
              run: 
                python --version
                pip --version
            - name: Completed
              run: echo "Verification done"
    
    finish:
        runs-on: ubuntu-latest
        needs: verify
        steps:
            - name: Completed
              run: echo "Pipeline finished"

#question : Then make the setup job fail deliberately and push again. Record what status the other two jobs are given, and write one line on why that status is not the same as failed.
# ans: When the setup job fails deliberately, the verify and finish jobs are marked as "skipped" instead of "failed" because they depend on the successful completion of the setup job, and since it did not complete successfully, they do not run.