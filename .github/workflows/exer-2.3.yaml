name: Trigger Detective

on:
    push:
    pull_request:
    workflow_dispatch:

jobs:
    detect:
        runs-on: ubuntu-latest
        steps:
            - name: Event that triggered the run
              run: echo "Event that triggered the run ${{ github.event_name }}"

            - name: Print pushed branch for push events
              if: github.event_name == 'push'
              run: echo "The push was made to the ${{ github.ref_name }} branch."

            - name: Print source and target branches for pull request events
              if: github.event_name == 'pull_request'
              run: echo "The PR source branch is ${{ github.head_ref }} and the target branch is ${{ github.base_ref }}."

            - name: Completed
              run: echo "Detective work complete"

    