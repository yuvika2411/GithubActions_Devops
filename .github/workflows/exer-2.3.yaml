name : The multi-trigger detective

on:
    push:
    pull_request:  
    workflow_dispatch:

jobs:
    detect:
        runs-on: ubuntu-latest
        steps:
            - name: name of the event that triggered the run
              run: echo "Event that triggered the run ${{ github.event_name }}"
            - name: If the event is a push, additionally print the branch that was pushed to
              run: echo "The push was made to the ${{ github.ref }} branch."
            - name: If the event is a pull_request, additionally print the source and target branches
              run: echo "The PR is merged into the ${{ github.base_ref }} branch."
            - name: Completed
              run: "Detective work complete"
    
              

    